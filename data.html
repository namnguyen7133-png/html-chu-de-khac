<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản Phẩm Khuyên Dùng</title>
  <style>
    /* Style theo phong cách hiện đại, sạch sẽ */
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f7; margin: 0; padding: 15px; }
    h1 { text-align: center; color: #ee4d2d; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
      gap: 15px; 
      max-width: 1200px; 
      margin: auto;
    }
    
    .card { 
      background: white; 
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      border: 1px solid #eee;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .img-box { 
      width: 100%; 
      height: 160px; 
      background: #f9f9f9; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    .img-sp { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
    .name { 
      font-size: 13px; 
      color: #333; 
      height: 36px; 
      line-height: 18px; 
      overflow: hidden; 
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
    }
    .price { color: #ee4d2d; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    
    .btn { 
      background: #ee4d2d; 
      color: white; 
      text-decoration: none; 
      text-align: center; 
      padding: 8px 0; 
      border-radius: 4px; 
      font-size: 13px; 
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover { background: #d73d1f; }
    
    #loading { text-align: center; padding: 50px; color: #888; font-style: italic; }
  </style>
</head>
<body>

  <h1>🔥 SẢN PHẨM KHUYÊN DÙNG 🔥</h1>
  
  <div id="loading">⌛ Đang quét kho hàng, vui lòng đợi...</div>
  <div id="list" class="grid"></div>

  <script>
    window.onload = function() {
      // Gọi hàm getWebData từ file getdata.gs
      google.script.run
        .withSuccessHandler(function(data) {
          const loading = document.getElementById("loading");
          const box = document.getElementById("list");
          
          loading.style.display = "none"; // Ẩn dòng thông báo đang tải
          
          if (!data || data.length === 0) { 
            box.innerHTML = "<div style='grid-column: 1/-1; text-align:center; padding:50px; color:#999;'>📭 Hiện chưa có sản phẩm nào đang bán.</div>"; 
            return; 
          }
          
          // Đổ dữ liệu vào giao diện
          box.innerHTML = data.map(p => `
            <div class="card">
              <div class="img-box">
                <img src="${p.img || 'https://via.placeholder.com/150?text=No+Image'}" 
                     class="img-sp" 
                     onerror="this.src='https://via.placeholder.com/150?text=Lỗi+Ảnh'">
              </div>
              <div class="info">
                <div class="name">${p.name}</div>
                <div class="price">${p.price ? Number(p.price).toLocaleString() : '0'}đ</div>
                <a href="${p.link}" class="btn" target="_blank">MUA NGAY</a>
              </div>
            </div>
          `).join('');
        })
        .withFailureHandler(function(err) {
          document.getElementById("loading").innerHTML = "❌ Lỗi kết nối: " + err;
        })
        .getWebData();
    };
  </script>
</body>
</html>
