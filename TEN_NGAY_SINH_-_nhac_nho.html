<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>TEN_NGAY_SINH - nhac_nho</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 30px; }
.box { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
h1 { color: #0d47a1; text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
th { background: #0d47a1; color: white; }
tr:nth-child(even) { background: #f9f9f9; }
.search-box { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
.back-btn { display: inline-block; margin-bottom: 15px; padding: 8px 15px; background: #555; color: white; text-decoration: none; border-radius: 4px; }
.back-btn:hover { background: #333; }
</style>
</head>
<body>
<div class="box">
    <a href="index_menu.html" class="back-btn">⬅ Quay lại danh mục</a>
    <h1>TEN_NGAY_SINH - nhac_nho</h1>
    <input type="text" id="search" class="search-box" placeholder="🔍 Tìm kiếm nhanh trong trang này..." onkeyup="timKiem()">
    <table>
        <thead>
            <tr>
                <th style="width: 80px;">STT</th>
                <th>Nội dung chi tiết</th>
            </tr>
        </thead>
        <tbody id="table-data">
            <tr>
                <td><b>1</b></td>
                <td>07/08/2026 | 4 | Lập Thu - còn 4 ngày</td>
            </tr>
            <tr>
                <td><b>2</b></td>
                <td>23/08/2026 | 20 | Xử Nữ - còn 20 ngày</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function timKiem() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.getElementById("table-data").getElementsByTagName("tr");
    for (let i = 0; i < rows.length; i++) {
        let text = rows[i].textContent.toLowerCase();
        rows[i].style.display = text.includes(input) ? "" : "none";
    }
}
</script>
<script src="bg-music.js"></script>
</body>
</html>
