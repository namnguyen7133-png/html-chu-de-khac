<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>02 - QUẢN TRỊ VỐN & VŨ KHÍ</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; margin:0; }
        .menu { background: #2d3436; padding: 15px; display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .menu a { color: white; text-decoration: none; font-weight: bold; padding: 10px 15px; border-radius: 5px; background: #3d4446; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 800px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h2 { grid-column: 1 / span 2; color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-top: 0; }
        label { font-size: 13px; font-weight: bold; color: #34495e; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; font-weight: bold; color: #d35400; box-sizing: border-box; }
        .btn { grid-column: 1 / span 2; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .total-box { grid-column: 1 / span 2; background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; }
        #res { font-size: 24px; color: #c0392b; font-weight: bold; }
        .tip { background: #fff5f5; border-left: 5px solid #e74c3c; padding: 10px; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="menu">
        <a href="SANNHA.html">🔍 1. SOI KÈO</a>
        <a href="KYTHUAT_VON.html" style="background: #27ae60;">💰 2. TÍNH VỐN</a>
        <a href="DAMPHAN_COC.html">🤝 3. ĐÀM PHÁN</a>
        <a href="DANG_TIN.html">📢 4. ĐĂNG TIN</a>
    </div>
    <div class="card">
        <h2>🛠️ DANH MỤC VŨ KHÍ CHIẾN ĐẤU</h2>
        <div>
            <label>1. Máy Photo Trâu Bò (Ricoh/Toshiba):</label>
            <input type="number" id="v1" value="25000000">
            <label>2. Máy In Màu + In Đen Trắng siêu tốc:</label>
            <input type="number" id="v2" value="12000000">
            <label>3. Dàn Máy Tính làm nghề:</label>
            <input type="number" id="v3" value="10000000">
            <label>4. Lioa ổn áp (Bắt buộc phải có):</label>
            <input type="number" id="v4" value="3000000">
        </div>
        <div>
            <label>5. Máy Ép Plastic + Cắt xén giấy:</label>
            <input type="number" id="v5" value="5000000">
            <label>6. Cọc nhà + Tiền thuê (3 tháng):</label>
            <input type="number" id="v6" value="30000000">
            <label>7. Quỹ dự phòng hụt thu (3 tháng):</label>
            <input type="number" id="v7" value="15000000">
            <div class="tip"><b>Mẹo:</b> Luôn giữ lại 15-20 triệu tiền mặt để nhập giấy và mực dự phòng.</div>
        </div>
        <button class="btn" onclick="calc()">TỔNG LỰC ĐẦU TƯ</button>
        <div class="total-box">
            <span>TỔNG VỐN CẦN CHUẨN BỊ:</span><br>
            <span id="res">--- VNĐ</span>
        </div>
    </div>
<script>
    function calc() {
        let t = 0;
        for(let i=1; i<=7; i++) { t += Number(document.getElementById('v'+i).value); }
        document.getElementById('res').innerText = t.toLocaleString() + " VNĐ";
    }
    window.onload = calc;
</script>
</body>
</html>
