<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc Nghiệm: Bạn Có Đang Cố Sống Theo Tầng Lớp Khác?</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --good:#22c55e;
    --bad:#ef4444;
    --warn:#f59e0b;
    --text:#e2e8f0;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
    color:var(--text);
    margin:0;
    padding:24px;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;}
  h1{
    text-align:center;
    font-size:1.6rem;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:8px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:28px;
    line-height:1.5;
  }
  .progress-bar{
    height:8px;
    background:#334155;
    border-radius:99px;
    overflow:hidden;
    margin-bottom:24px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    width:0%;
    transition:width .4s ease;
  }
  .question-card{
    background:var(--card);
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    margin-bottom:20px;
    animation:fade .4s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .q-number{
    color:var(--accent);
    font-size:.85rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .q-text{
    font-size:1.1rem;
    line-height:1.6;
    margin-bottom:18px;
    font-weight:600;
  }
  .context{
    background:#0f172a;
    border-left:4px solid var(--accent);
    padding:12px 16px;
    border-radius:8px;
    font-size:.9rem;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:18px;
  }
  .answers{display:flex;flex-direction:column;gap:10px;}
  .answer{
    background:#0f172a;
    border:2px solid #334155;
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:all .2s;
    font-size:.95rem;
    line-height:1.5;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .answer:hover:not(.disabled){
    border-color:var(--accent);
    transform:translateX(4px);
  }
  .answer .key{
    font-weight:700;
    color:var(--accent);
    flex-shrink:0;
  }
  .answer.correct{
    border-color:var(--good);
    background:rgba(34,197,94,.12);
  }
  .answer.correct .key{color:var(--good);}
  .answer.wrong{
    border-color:var(--bad);
    background:rgba(239,68,68,.12);
  }
  .answer.wrong .key{color:var(--bad);}
  .answer.disabled{cursor:default;opacity:.85;}

  .feedback{
    margin-top:18px;
    padding:16px;
    border-radius:10px;
    font-size:.92rem;
    line-height:1.7;
    display:none;
  }
  .feedback.show{display:block;animation:fade .3s ease;}
  .feedback.correct-fb{
    background:rgba(34,197,94,.12);
    border:1px solid var(--good);
  }
  .feedback.wrong-fb{
    background:rgba(239,68,68,.12);
    border:1px solid var(--bad);
  }
  .feedback h4{margin:0 0 8px 0;font-size:1rem;}
  .feedback .advice{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed #475569;
    color:var(--warn);
    font-style:italic;
  }
  .next-btn{
    display:none;
    margin-top:16px;
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    border:none;
    border-radius:10px;
    color:#0f172a;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform .2s;
  }
  .next-btn:hover{transform:scale(1.02);}
  .next-btn.show{display:block;}

  .result-card{
    display:none;
    background:var(--card);
    border-radius:16px;
    padding:32px;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    animation:fade .5s ease;
  }
  .result-card.show{display:block;}
  .score{
    font-size:3rem;
    font-weight:800;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:10px 0;
  }
  .verdict{
    font-size:1.1rem;
    line-height:1.8;
    margin:16px 0;
  }
  .final-advice{
    background:#0f172a;
    border-left:4px solid var(--warn);
    padding:16px 20px;
    border-radius:8px;
    text-align:left;
    font-size:.95rem;
    line-height:1.8;
    color:var(--text);
    margin-top:20px;
  }
  .restart{
    margin-top:24px;
    padding:14px 32px;
    background:transparent;
    border:2px solid var(--accent);
    color:var(--accent);
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    transition:all .2s;
  }
  .restart:hover{background:var(--accent);color:#0f172a;}
  .silent-badge{
    display:inline-block;
    background:#334155;
    color:var(--muted);
    font-size:.75rem;
    padding:2px 8px;
    border-radius:99px;
    margin-left:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 Trắc Nghiệm Hoàn Cảnh & Tiêu Dùng</h1>
  <p class="subtitle">
    5 câu hỏi · Mỗi câu 5 đáp án · 1 đúng, 4 nhiễu<br>
    Mục tiêu: nhận diện bạn có đang cố tiêu dùng theo tầng lớp khác không.
  </p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quizArea"></div>

  <div class="result-card" id="resultCard">
    <h2>📊 Kết Quả Của Bạn</h2>
    <div class="score" id="scoreText">0/5</div>
    <div class="verdict" id="verdictText"></div>
    <div class="final-advice" id="finalAdvice"></div>
    <button class="restart" onclick="location.reload()">🔄 Làm Lại</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    context: "Nhân vật: Nam, 24 tuổi, nhân viên văn phòng lương 8 triệu/tháng, ở trọ, còn nợ học phí.",
    q: "Bạn thân của nhân vật vừa rủ đi mua iPhone 15 Pro Max trả góp 0% để 'bằng bạn bằng bè'. Nhân vật nên làm gì?",
    answers: [
      { text: "Mua ngay vì trả góp 0% không lãi, có máy xịn để tự tin.", correct: false },
      { text: "Từ chối, tiếp tục dùng điện thoại cũ còn tốt, ưu tiên trả nợ học phí.", correct: true },
      { text: "Vay thêm tiền bạn bè để mua, sau này trả dần.", correct: false },
      { text: "Mua máy rẻ hơn nhưng vẫn phải là hàng hiệu để giữ thể diện.", correct: false },
      { text: "Im lặng, không nói gì, để bạn tự hiểu.", correct: false }
    ],
    explain: "Đáp án đúng là B. Khi thu nhập chưa đủ và còn nợ, việc mua sắm theo bạn bè cùng tầng lớp là dấu hiệu 'chi tiêu theo tầng lớp khác'. Điện thoại cũ còn dùng tốt thì chưa cần thay.",
    advice: "Nếu hoàn cảnh của bạn giống nhân vật — thu nhập thấp, còn nợ, ở trọ — thì đừng mua iPhone trả góp chỉ để bằng bạn. Bạn đang cố sống theo tầng lớp trung lưu/khá giả trong khi túi tiền chưa cho phép. Hãy ưu tiên trả nợ và xây quỹ dự phòng trước."
  },
  {
    context: "Nhân vật: Nữ, 28 tuổi, lương 12 triệu/tháng, đang thuê trọ, mẹ bệnh cần tiền thuốc hàng tháng.",
    q: "Đồng nghiệp rủ mua túi xách hàng hiệu 25 triệu 'để đi tiệc khách hàng cho sang'. Nhân vật nên xử lý thế nào?",
    answers: [
      { text: "Mua trả góp 12 tháng vì công việc cần hình ảnh sang trọng.", correct: false },
      { text: "Mua túi fake loại 1 giá 2 triệu, nhìn giống thật là được.", correct: false },
      { text: "Từ chối, dùng túi tốt sẵn có, dành tiền cho thuốc của mẹ và tiết kiệm.", correct: true },
      { text: "Mượn tiền đồng nghiệp mua túi thật, sau trả dần.", correct: false },
      { text: "Im lặng, không tham gia cuộc vui, cắt liên lạc với đồng nghiệp.", correct: false }
    ],
    explain: "Đáp án đúng là C. Ưu tiên sức khỏe gia đình và tài chính an toàn quan trọng hơn hình ảnh bề ngoài. Túi xách không quyết định năng lực của bạn.",
    advice: "Nếu bạn giống nhân vật — có người nhà bệnh, thu nhập hạn chế — thì đừng mua túi hiệu hay fake để 'diễn' theo tầng lớp khác. Sự sang trọng thật sự là sự an tâm về tài chính, không phải món đồ trên vai."
  },
  {
    context: "Nhân vật: Nam, 30 tuổi, lương 15 triệu/tháng, chưa có nhà, đang tiết kiệm mua nhà.",
    q: "Bạn cùng phòng mua xe ô tô 700 triệu trả góp 5 năm, rủ nhân vật mua theo 'cho oai'. Nhân vật nên làm gì?",
    answers: [
      { text: "Mua xe tương tự vì có xe mới được coi là thành đạt.", correct: false },
      { text: "Từ chối, tiếp tục đi xe máy/ xe buýt, dồn tiền mua nhà trước.", correct: true },
      { text: "Mua xe cũ giá rẻ hơn nhưng vẫn phải là xe hơi cho bằng bạn.", correct: false },
      { text: "Im lặng, không góp ý, mặc kệ bạn.", correct: false },
      { text: "Vay ngân hàng mua xe rồi cho thuê lại để trả góp.", correct: false }
    ],
    explain: "Đáp án đúng là B. Khi mục tiêu lớn là mua nhà, việc gánh thêm khoản trả góp xe hơi là 'chi tiêu theo tầng lớp khác' điển hình. Xe hơi là tiêu sản, mất giá nhanh.",
    advice: "Nếu hoàn cảnh của bạn giống nhân vật — chưa có nhà, đang tiết kiệm — thì đừng mua xe hơi chỉ để 'bằng bạn'. Bạn đang cố sống theo tầng lớp trung lưu có xe hơi trong khi ưu tiên thật sự là an cư. Hãy mua nhà trước, xe sau."
  },
  {
    context: "Nhân vật: Nữ, 22 tuổi, sinh viên năm cuối, thu nhập từ làm thêm 4 triệu/tháng, bố mẹ làm nông.",
    q: "Bạn cùng lớp tổ chức tiệc sinh nhật ở nhà hàng 5 sao, chi phí 2 triệu/người, rủ nhân vật tham gia. Nhân vật nên làm gì?",
    answers: [
      { text: "Tham gia cho bằng bạn, xin bố mẹ thêm tiền.", correct: false },
      { text: "Vay nóng bạn bè để đi cho không mất mặt.", correct: false },
      { text: "Từ chối khéo, chúc mừng qua tin nhắn, dành tiền cho việc học.", correct: true },
      { text: "Im lặng, không trả lời, coi như không biết.", correct: false },
      { text: "Đi nhưng chỉ ăn uống ít để tiết kiệm.", correct: false }
    ],
    explain: "Đáp án đúng là C. Với thu nhập 4 triệu/tháng và gia đình làm nông, việc chi 2 triệu cho một buổi tiệc là vượt quá khả năng. Từ chối khéo là cách giữ thể diện mà không phá vỡ tài chính.",
    advice: "Nếu bạn giống nhân vật — sinh viên, thu nhập thấp, gia đình khó khăn — thì đừng cố tham gia những buổi tiệc xa xỉ của tầng lớp khác. Bạn không cần chứng minh gì với ai. Hãy dùng tiền đó cho sách vở, kỹ năng, hoặc gửi về cho gia đình."
  },
  {
    context: "Nhân vật: Nam, 35 tuổi, lương 20 triệu/tháng, có vợ và 1 con nhỏ, đang trả góp nhà.",
    q: "Đồng nghiệp rủ mua đồng hồ Thụy Sĩ 50 triệu 'để đẳng cấp'. Nhân vật nên quyết định thế nào?",
    answers: [
      { text: "Mua trả góp vì đàn ông phải có đồng hồ xịn.", correct: false },
      { text: "Mua đồng hồ replica 3 triệu nhìn giống thật.", correct: false },
      { text: "Từ chối, dùng đồng hồ hiện có, ưu tiên trả góp nhà và lo cho con.", correct: true },
      { text: "Im lặng, không nói gì, để đồng nghiệp tự mua.", correct: false },
      { text: "Mua đồng hồ tầm 10 triệu coi như 'bản lề' cho oai.", correct: false }
    ],
    explain: "Đáp án đúng là C. Khi đang trả góp nhà và có con nhỏ, mọi khoản chi lớn cho hình ảnh cá nhân đều là 'chi tiêu theo tầng lớp khác'. Đồng hồ không làm bạn giàu hơn.",
    advice: "Nếu hoàn cảnh của bạn giống nhân vật — có gia đình, đang trả góp nhà — thì đừng mua đồng hồ hiệu chỉ để 'đẳng cấp'. Bạn đang cố sống theo tầng lớp thượng lưu trong khi trách nhiệm gia đình mới là ưu tiên. Hãy nhớ: đẳng cấp thật sự là sự ổn định tài chính cho vợ con."
  }
];

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const resultCard = document.getElementById('resultCard');
const scoreText = document.getElementById('scoreText');
const verdictText = document.getElementById('verdictText');
const finalAdvice = document.getElementById('finalAdvice');

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[current];
  progressFill.style.width = ((current / QUESTIONS.length) * 100) + '%';

  quizArea.innerHTML = `
    <div class="question-card">
      <div class="q-number">Câu ${current+1} / ${QUESTIONS.length}</div>
      <div class="context">${q.context}</div>
      <div class="q-text">${q.q}</div>
      <div class="answers" id="answersBox">
        ${q.answers.map((a,i)=>`
          <div class="answer" data-index="${i}">
            <span class="key">${String.fromCharCode(65+i)}.</span>
            <span>${a.text}</span>
          </div>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">
        ${current === QUESTIONS.length - 1 ? '📊 Xem Kết Quả' : '➡️ Câu Tiếp Theo'}
      </button>
    </div>
  `;

  document.querySelectorAll('.answer').forEach(el=>{
    el.addEventListener('click', ()=> selectAnswer(el));
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function selectAnswer(el){
  if(answered) return;
  answered = true;
  const idx = parseInt(el.dataset.index);
  const q = QUESTIONS[current];
  const isCorrect = q.answers[idx].correct;
  if(isCorrect) score++;

  document.querySelectorAll('.answer').forEach((a,i)=>{
    a.classList.add('disabled');
    if(q.answers[i].correct) a.classList.add('correct');
    if(i === idx && !isCorrect) a.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `
    <h4>${isCorrect ? '✅ Chính xác!' : '❌ Chưa đúng'}</h4>
    <div>${q.explain}</div>
    <div class="advice">💡 ${q.advice}</div>
  `;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  current++;
  if(current < QUESTIONS.length){
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  progressFill.style.width = '100%';
  quizArea.innerHTML = '';
  resultCard.classList.add('show');
  scoreText.textContent = score + '/' + QUESTIONS.length;

  let verdict = '';
  if(score === 5){
    verdict = '🌟 Bạn có tư duy tài chính rất tỉnh táo. Bạn biết rõ hoàn cảnh của mình và không bị cuốn theo tầng lớp khác.';
  } else if(score >= 3){
    verdict = '👍 Bạn khá ổn, nhưng đôi lúc vẫn còn bị ảnh hưởng bởi bạn bè. Hãy tiếp tục giữ kỷ luật chi tiêu.';
  } else if(score >= 1){
    verdict = '⚠️ Bạn đang có dấu hiệu chi tiêu theo tầng lớp khác. Cần xem lại ưu tiên tài chính của mình.';
  } else {
    verdict = '🚨 Bạn rất dễ bị cuốn theo tầng lớp khác. Hãy dừng lại và nhìn vào hoàn cảnh thật của mình.';
  }
  verdictText.textContent = verdict;

  let advice = '';
  if(score >= 4){
    advice = 'Bạn đang làm tốt. Hãy tiếp tục ưu tiên: trả nợ → quỹ dự phòng → đầu tư cho bản thân → mới đến hưởng thụ. Đừng để áp lực bạn bè thay đổi điều đó.';
  } else if(score >= 2){
    advice = 'Bạn cần nhớ: mỗi người có một xuất phát điểm khác nhau. Đừng lấy tiêu chuẩn của tầng lớp khác làm thước đo cho mình. Hãy sống theo khả năng, không theo hình ảnh.';
  } else {
    advice = 'Nếu hoàn cảnh của bạn giống các nhân vật trong câu hỏi — thu nhập thấp, còn nợ, gia đình khó khăn — thì TUYỆT ĐỐI không nên mua sắm, tiệc tùng, hoặc tiêu dùng theo tầng lớp xã hội khác. Bạn đang tự tạo áp lực tài chính và đánh mất tự do của chính mình. Hãy bắt đầu từ việc: ghi chép chi tiêu, cắt giảm đồ hiệu, tập trung vào thu nhập và kỹ năng.';
  }
  finalAdvice.innerHTML = '<b>💬 Lời khuyên cuối:</b><br>' + advice;
}

renderQuestion();
</script>
</body>
</html>
