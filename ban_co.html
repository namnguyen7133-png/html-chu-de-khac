<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn Cờ Trăm Năm - 90 Khuyết Điểm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F19',
                        darkcard: '#1E293B',
                        darkborder: '#334155',
                        husband: '#3B82F6',
                        wife: '#EC4899',
                        warning: '#EF4444',
                        amber: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1E293B; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748B; }

        .board-container { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .board-flipped { transform: rotate(180deg); }
        .board-flipped .piece-content { transform: rotate(180deg); }

        .piece-selected-husband {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            border-color: #EF4444 !important;
            background-color: #7F1D1D !important;
            color: #FEE2E2 !important;
        }
        .piece-selected-wife {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            border-color: #EF4444 !important;
            background-color: #831843 !important;
            color: #FCE7F3 !important;
        }

        .board-grid-bg {
            background-image: 
                linear-gradient(to right, #334155 1px, transparent 1px),
                linear-gradient(to bottom, #334155 1px, transparent 1px);
            background-size: 11.111% 10%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 via-amber-500 to-blue-600 flex items-center justify-center text-white text-xl font-bold shadow-lg">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-rose-400 via-amber-300 to-blue-400 bg-clip-text text-transparent">
                        BÀN CỜ TRĂM NĂM
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">90 Khuyết Điểm Cần Cân Nhắc Khi Chọn Bạn Đời</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnFlip" onclick="toggleFlipBoard()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i>
                    <span class="hidden sm:inline">Đảo Bàn Cờ</span>
                </button>
                <button onclick="openHistoryModal()" class="px-3 py-2 bg-purple-900/40 hover:bg-purple-800/50 text-purple-300 border border-purple-700/50 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Lịch Sử</span>
                </button>
                <button onclick="resetCurrentMatch()" class="px-3 py-2 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span class="hidden sm:inline">Làm Mới</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-2 sm:px-4 py-4 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-8 flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/80 border-2 border-blue-600/40 rounded-xl p-3 sm:p-4 flex flex-col justify-between relative overflow-hidden shadow-lg">
                    <div class="absolute -right-4 -bottom-4 text-blue-500/10 text-7xl font-black pointer-events-none">
                        <i class="fa-solid fa-mars"></i>
                    </div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold uppercase tracking-wider text-blue-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-mars"></i> CHỒNG / BẠN TRAI
                        </span>
                        <span id="scoreHusband" class="text-2xl sm:text-3xl font-black text-rose-500">0 / 45</span>
                    </div>
                    <input type="text" id="nameHusband" value="Chú Rể" placeholder="Nhập tên Nam..." 
                           class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 text-slate-100 rounded-lg px-3 py-1.5 text-base font-bold outline-none transition">
                </div>
                <div class="bg-slate-900/80 border-2 border-pink-600/40 rounded-xl p-3 sm:p-4 flex flex-col justify-between relative overflow-hidden shadow-lg">
                    <div class="absolute -right-4 -bottom-4 text-pink-500/10 text-7xl font-black pointer-events-none">
                        <i class="fa-solid fa-venus"></i>
                    </div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold uppercase tracking-wider text-pink-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-venus"></i> VỢ / BẠN GÁI
                        </span>
                        <span id="scoreWife" class="text-2xl sm:text-3xl font-black text-rose-500">0 / 45</span>
                    </div>
                    <input type="text" id="nameWife" value="Cô Dâu" placeholder="Nhập tên Nữ..." 
                           class="w-full bg-slate-950 border border-slate-700 focus:border-pink-500 text-slate-100 rounded-lg px-3 py-1.5 text-base font-bold outline-none transition">
                </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm khuyết điểm..." 
                           class="w-full bg-slate-950 border border-slate-700 focus:border-rose-500 text-slate-200 rounded-lg pl-9 pr-3 py-2 text-sm outline-none transition">
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="filterCategory('all')" id="filterAll" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 border border-amber-400">Tất cả (90)</button>
                    <button onclick="filterCategory('husband')" id="filterHusband" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-blue-400 hover:bg-slate-700 border border-blue-900">Khuyết Điểm Nam (45)</button>
                    <button onclick="filterCategory('wife')" id="filterWife" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-pink-400 hover:bg-slate-700 border border-pink-900">Khuyết Điểm Nữ (45)</button>
                </div>
            </div>

            <div class="bg-slate-900/90 border-2 border-slate-800 rounded-2xl p-3 sm:p-6 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center">
                <div class="w-full flex justify-between items-center text-xs font-extrabold text-slate-500 px-4 mb-2 tracking-widest uppercase">
                    <span>Nam Khuyết Điểm (Hàng 1-5)</span>
                    <span>Sông Tương Phùng</span>
                    <span>Nữ Khuyết Điểm (Hàng 6-10)</span>
                </div>
                <div class="w-full overflow-x-auto pb-2 flex justify-center">
                    <div id="boardContainer" class="board-container min-w-[620px] max-w-[800px] w-full aspect-[9/10] bg-slate-950 border-4 border-slate-800 rounded-xl p-3 relative shadow-inner">
                        <div class="absolute inset-4 board-grid-bg opacity-30 pointer-events-none rounded"></div>
                        <div id="boardGrid" class="relative z-10 grid grid-cols-9 grid-rows-10 gap-1.5 sm:gap-2 h-full w-full"></div>
                    </div>
                </div>
                <div class="w-full mt-4 flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <div class="text-xs text-slate-400 text-center sm:text-left">
                        Đã chọn cảnh báo: <span id="selectedCountText" class="font-bold text-rose-500">0</span>/90 khuyết điểm.
                    </div>
                    <button onclick="saveMatchHistory()" class="w-full sm:w-auto px-6 py-2.5 bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-extrabold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>GHI ĐIỂM VÁN ĐẤU NÀY</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4 flex flex-col gap-4">
            <div id="detailCard" class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col justify-between min-h-[340px] relative overflow-hidden transition-all">
                <div id="detailPlaceholder" class="flex flex-col items-center justify-center h-full my-auto text-center py-10">
                    <div class="w-16 h-16 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-2xl mb-3 animate-pulse">
                        <i class="fa-solid fa-hand-pointer"></i>
                    </div>
                    <h3 class="text-slate-300 font-bold text-base">CHƯA CHỌN KHUYẾT ĐIỂM NÀO</h3>
                    <p class="text
