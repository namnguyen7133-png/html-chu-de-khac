    const grid = document.getElementById("listGrid");
    const input = document.getElementById("searchInput");
    const badge = document.getElementById("countBadge");
    const empty = document.getElementById("emptyState");

    function render(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const filtered = q
        ? ITEMS.filter(x =>
            x.title.toLowerCase().includes(q) ||
            x.name.toLowerCase().includes(q) ||
            x.rel_path.toLowerCase().includes(q)
          )
        : ITEMS;

      badge.textContent = `Hiển thị ${filtered.length} / ${ITEMS.length} tệp`;
      if (!filtered.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      grid.innerHTML = filtered.map(x => `
        <a class="item" href="${encodeURI(x.rel_path)}">
          <div>
            <div class="item-title">${escapeHtml(x.title)}</div>
            <div class="item-file">${escapeHtml(x.rel_path)}</div>
          </div>
          <div class="item-meta">
            <span>${escapeHtml(x.size_text)}</span>
            <span>Mở tệp →</span>
          </div>
        </a>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    input.addEventListener("input", e => render(e.target.value));
    render("");
  </script>
