<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc Nghiệm: Bài Học Từ Web 68</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --good:#22c55e;
    --bad:#ef4444;
    --warn:#f59e0b;
    --text:#e2e8f0;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
    color:var(--text);
    margin:0;
    padding:24px;
    min-height:100vh;
  }
  .wrap{max-width:860px;margin:0 auto;}
  h1{
    text-align:center;
    font-size:1.55rem;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:8px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.92rem;
    margin-bottom:24px;
    line-height:1.5;
  }
  .progress-bar{
    height:8px;
    background:#334155;
    border-radius:99px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    width:0%;
    transition:width .4s ease;
  }
  .question-card{
    background:var(--card);
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    margin-bottom:20px;
    animation:fade .4s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .q-number{
    color:var(--accent);
    font-size:.82rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .source-tag{
    display:inline-block;
    background:#0f172a;
    color:var(--muted);
    font-size:.72rem;
    padding:3px 10px;
    border-radius:99px;
    margin-bottom:10px;
    border:1px solid #334155;
  }
  .context{
    background:#0f172a;
    border-left:4px solid var(--accent);
    padding:12px 16px;
    border-radius:8px;
    font-size:.9rem;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:16px;
  }
  .q-text{
    font-size:1.05rem;
    line-height:1.6;
    margin-bottom:16px;
    font-weight:600;
  }
  .answers{display:flex;flex-direction:column;gap:10px;}
  .answer{
    background:#0f172a;
    border:2px solid #334155;
    border-radius:10px;
    padding:13px 15px;
    cursor:pointer;
    transition:all .2s;
    font-size:.93rem;
    line-height:1.5;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .answer:hover:not(.disabled){
    border-color:var(--accent);
    transform:translateX(4px);
  }
  .answer .key{
    font-weight:700;
    color:var(--accent);
    flex-shrink:0;
  }
  .answer.correct{
    border-color:var(--good);
    background:rgba(34,197,94,.12);
  }
  .answer.correct .key{color:var(--good);}
  .answer.wrong{
    border-color:var(--bad);
    background:rgba(239,68,68,.12);
  }
  .answer.wrong .key{color:var(--bad);}
  .answer.disabled{cursor:default;opacity:.85;}

  .feedback{
    margin-top:16px;
    padding:16px;
    border-radius:10px;
    font-size:.9rem;
    line-height:1.7;
    display:none;
  }
  .feedback.show{display:block;animation:fade .3s ease;}
  .feedback.correct-fb{
    background:rgba(34,197,94,.12);
    border:1px solid var(--good);
  }
  .feedback.wrong-fb{
    background:rgba(239,68,68,.12);
    border:1px solid var(--bad);
  }
  .feedback h4{margin:0 0 8px 0;font-size:.98rem;}
  .feedback .advice{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed #475569;
    color:var(--warn);
    font-style:italic;
  }
  .next-btn{
    display:none;
    margin-top:16px;
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    border:none;
    border-radius:10px;
    color:#0f172a;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform .2s;
  }
  .next-btn:hover{transform:scale(1.02);}
  .next-btn.show{display:block;}

  .result-card{
    display:none;
    background:var(--card);
    border-radius:16px;
    padding:32px;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    animation:fade .5s ease;
  }
  .result-card.show{display:block;}
  .score{
    font-size:3rem;
    font-weight:800;
    background:linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:10px 0;
  }
  .verdict{
    font-size:1.05rem;
    line-height:1.8;
    margin:16px 0;
  }
  .final-advice{
    background:#0f172a;
    border-left:4px solid var(--warn);
    padding:16px 20px;
    border-radius:8px;
    text-align:left;
    font-size:.94rem;
    line-height:1.8;
    color:var(--text);
    margin-top:20px;
  }
  .restart{
    margin-top:24px;
    padding:14px 32px;
    background:transparent;
    border:2px solid var(--accent);
    color:var(--accent);
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    transition:all .2s;
  }
  .restart:hover{background:var(--accent);color:#0f172a;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Trắc Nghiệm Bài Học Nhân Sinh</h1>
  <p class="subtitle">
    10 câu hỏi dựa trên nội dung các phim/truyện trong Web 68<br>
    Mỗi câu 5 đáp án · 1 đúng · 4 nhiễu · 1 đáp án "im lặng"
  </p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="quizArea"></div>

  <div class="result-card" id="resultCard">
    <h2>📊 Kết Quả Của Bạn</h2>
    <div class="score" id="scoreText">0/10</div>
    <div class="verdict" id="verdictText"></div>
    <div class="final-advice" id="finalAdvice"></div>
    <button class="restart" onclick="location.reload()">🔄 Làm Lại</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    source: "Chủ tịch ăn mặc giản dị bị nhân viên khinh thường",
    context: "Nhân vật: Chủ tịch Tần Minh Đức, người giàu nhất Giang Thành, mặc áo vải giản dị dẫn vợ con đi mua sắm. Nhân viên cửa hàng trang sức cao cấp nhìn bộ dạng nghèo hèn liền khinh thường, đuổi khách.",
    q: "Khi bị nhân viên cửa hàng đánh giá thấp vì ăn mặc giản dị, nhân vật nên xử sự thế nào?",
    answers: [
      { text: "Lập tức rút thẻ đen kim cương ra để chứng minh ta đây giàu, cho nhân viên biết tay.", correct: false },
      { text: "Bình tĩnh, giữ phong thái, không cần chứng minh bản thân với kẻ chỉ nhìn bề ngoài.", correct: true },
      { text: "Im lặng bỏ đi, không nói gì, coi như không có chuyện gì xảy ra.", correct: false },

    advice: "Nếu hoàn cảnh của bạn giống nhân vật — có tiền nhưng bị đánh giá thấp vì ăn mặc — thì đừng vội mua sắm hàng hiệu chỉ để chứng minh. Bạn đang cố chạy theo tầng lớp xã hội khác bằng vẻ bề ngoài. Giá trị thật của bạn nằm ở nhân cách và năng lực, không phải ở món đồ bạn đeo."

  {

      { text: "Nói chuyện thẳng thắn với chồng, yêu cầu phân chia công việc rõ ràng và tách chi tiêu.", correct: true },

      { text: "Nhịn nhưng bí mật theo dõi, thu thập bằng chứng để sau này kiện ly hôn.", correct: false }

    advice: "Nếu hoàn cảnh của bạn giống nhân vật — có năng lực, độc lập về tài chính, nhưng hôn nhân không hạnh phúc — thì đừng vì áp lực 'phải giữ gia đình' mà tiếp tục chịu đựng. Bạn không cần mua sắm hàng hiệu hay sống theo chuẩn mực của tầng lớp khác để chứng minh mình hạnh phúc. Hạnh phúc thật là sự an yên trong tâm hồn."

    q: "Khi có gia đình nhưng vẫn bị cám dỗ bởi những mối quan hệ ngoài luồng, bạn nên làm gì?",
    answers: [
      { text: "Dừng lại, tập trung vào gia đình, vì đó là nơi bạn thực sự thuộc về.", correct: true },
      { text: "Im lặng, coi như không có chuyện gì, miễn là không ai phát hiện.", correct: false },

      { text: "Cắt liên lạc nhưng giữ bí mật, không cho vợ biết để tránh phiền phức.", correct: false }
    ],
    explain: "Đáp án đúng là A. Phản bội là phản bội, dù có che giấu hay bù đắp bằng vật chất. Điều duy nhất đúng đắn là dừng lại và tập trung vào gia đình — nơi bạn đã cam kết gắn bó.",
    advice: "Nếu hoàn cảnh của bạn giống nhân vật — có vợ con nhưng vẫn bị cám dỗ bởi những mối quan hệ ngoài luồng — thì đừng dùng tiền để mua sắm quà cáp cho nhân tình. Bạn đang cố sống theo kiểu 'đại gia' của tầng lớp khác trong khi trách nhiệm gia đình mới là ưu tiên. Hãy nhớ: hạnh phúc thật không nằm ở số lượng mối quan hệ, mà ở chất lượng của một mối quan hệ."

  {

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const resultCard = document.getElementById('resultCard');
const scoreText = document.getElementById('scoreText');
const verdictText = document.getElementById('verdictText');
const finalAdvice = document.getElementById('finalAdvice');

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[current];
  progressFill.style.width = ((current / QUESTIONS.length) * 100) + '%';

  quizArea.innerHTML = `
    <div class="question-card">
      <div class="q-number">Câu ${current+1} / ${QUESTIONS.length}</div>
      <div class="source-tag">📽 ${q.source}</div>
      <div class="context">${q.context}</div>
      <div class="q-text">${q.q}</div>
      <div class="answers" id="answersBox">
        ${q.answers.map((a,i)=>`
          <div class="answer" data-index="${i}">
            <span class="key">${String.fromCharCode(65+i)}.</span>
            <span>${a.text}</span>
          </div>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">
        ${current === QUESTIONS.length - 1 ? '📊 Xem Kết Quả' : '➡️ Câu Tiếp Theo'}
      </button>
    </div>
  `;

  document.querySelectorAll('.answer').forEach(el=>{
    el.addEventListener('click', ()=> selectAnswer(el));
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function selectAnswer(el){
  if(answered) return;
  answered = true;
  const idx = parseInt(el.dataset.index);
  const q = QUESTIONS[current];
  const isCorrect = q.answers[idx].correct;
  if(isCorrect) score++;

  document.querySelectorAll('.answer').forEach((a,i)=>{
    a.classList.add('disabled');
    if(q.answers[i].correct) a.classList.add('correct');
    if(i === idx && !isCorrect) a.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `
    <h4>${isCorrect ? '✅ Chính xác!' : '❌ Chưa đúng'}</h4>
    <div>${q.explain}</div>
    <div class="advice">💡 ${q.advice}</div>
  `;
  document.getElementById('nextBtn
