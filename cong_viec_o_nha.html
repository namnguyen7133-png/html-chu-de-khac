    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#38bdf8',
                        accentGreen: '#4ade80',

    <style>
        /* Custom scrollbar and smooth aesthetics */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Grid structure for uniform 3-column rows */
        .data-row {
            display: grid;
            grid-template-columns: 140px 60px 1fr;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 640px) {
            .data-row {
                grid-template-columns: 100px 45px 1fr;
                gap: 8px;
            }
        }

        /* Glassmorphic sticky header */
        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom styling for range input */
        input[type=range] {
            accent-color: #38bdf8;
        }

                    ▶ Đang cuộn
                </span>
            </div>

            <!-- Controls Group -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">

                    <span id="btn-toggle-icon">⏸</span>
                    <span id="btn-toggle-text" class="hidden sm:inline">Tạm dừng</span>

                    <span>↺</span>
                    <span class="hidden sm:inline">Tua lại</span>

                    <span class="text-xs text-slate-400 font-medium">Tốc độ:</span>

                    <span id="speed-val" class="text-xs text-sky-400 font-bold w-4">3</span>
                </div>

                <!-- Font Size Controls -->
                <div class="flex items-center bg-slate-800/80 rounded-lg border border-slate-700 p-0.5">
                    <button id="btn-font-dec" class="px-2 py-1 text-slate-300 hover:text-white font-bold text-xs hover:bg-slate-700 rounded transition">A-</button>

                    <button id="btn-font-inc" class="px-2 py-1 text-slate-300 hover:text-white font-bold text-xs hover:bg-slate-700 rounded transition">A+</button>

                items: [

                    { price: "15.000 - 35.000 điểm", desc: "Du lịch Đông Bắc Á cá nhân (Hàn Quốc, Nhật Bản, Trung Quốc...)." },
                    { price: "40.000 - 100.000+ điểm", desc: "Du lịch Nước ngoài trọn gói cho Cả Gia Đình." },

        ];

        // RENDER DATA INTO DOM WITH GLOBAL SEQUENTIAL NUMBERING
        const container = document.getElementById('content-container');
        let globalIndex = 1;

        categories.forEach((cat) => {
            // Category Header Block
            const catHeader = document.createElement('div');
            catHeader.className = "pt-4 pb-2 sticky top-[100px] z-30 bg-darkBg/95 backdrop-blur-md";
            catHeader.innerHTML = `
                <div class="px-4 py-2.5 rounded-xl bg-gradient-to-r ${cat.color} text-white font-bold text-base sm:text-lg shadow-lg tracking-wide border border-white/10 flex items-center justify-between">
                    <span>${cat.title}</span>
                    <span class="text-xs bg-black/30 px-2 py-1 rounded-md font-mono">${cat.items.length} mục</span>
                </div>
            `;
            container.appendChild(catHeader);

            // Category Data Items
            cat.items.forEach((item) => {
                const row = document.createElement('div');
                row.className = "data-row px-3 py-2.5 rounded-lg bg-cardBg/70 hover:bg-slate-800 transition border border-slate-800/80 shadow-sm text-content";
                
                row.innerHTML = `
                    <div class="text-emerald-400 font-bold font-mono text-sm sm:text-base break-words">${item.price}</div>
                    <div class="text-orange-400 font-extrabold font-mono text-sm sm:text-base text-center bg-orange-950/40 py-1 rounded border border-orange-500/20">${globalIndex}</div>
                    <div class="text-slate-200 text-sm sm:text-base leading-relaxed break-words">${item.desc}</div>
                `;
                container.appendChild(row);
                globalIndex++;
            });
        });

        // AUTO-SCROLL ENGINE & CONTROLS
        let isPlaying = true;
        let speed = 3; // pixels per frame divisor/step
        let currentFontSize = 16; // base font size in px
        let animationFrameId = null;

        const btnToggle = document.getElementById('btn-toggle');
        const btnToggleIcon = document.getElementById('btn-toggle-icon');
        const btnToggleText = document.getElementById('btn-toggle-text');
        const badge = document.getElementById('scroll-status-badge');
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');

        // Main animation loop
        function scrollLoop() {
            if (isPlaying) {
                // Scroll down smoothly
                window.scrollBy(0, speed * 0.4);

                // Auto restart when reaching near bottom
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                    window.scrollTo({ top: 0, behavior: 'instant' });
                }
            }
            animationFrameId = requestAnimationFrame(scrollLoop);
        }

        // Toggle Play / Pause state
        function togglePlayPause() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                btnToggleIcon.innerText = "⏸";
                btnToggleText.innerText = "Tạm dừng";
                btnToggle.classList.replace('bg-emerald-600', 'bg-sky-600');
                btnToggle.classList.replace('hover:bg-emerald-500', 'hover:bg-sky-500');
                badge.innerText = "▶ Đang cuộn";
                badge.className = "text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            } else {
                btnToggleIcon.innerText = "▶";
                btnToggleText.innerText = "Tiếp tục";
                btnToggle.classList.replace('bg-sky-600', 'bg-emerald-600');
                btnToggle.classList.replace('hover:bg-sky-500', 'hover:bg-emerald-500');
                badge.innerText = "⏸ Tạm dừng";
                badge.className = "text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
            }
        }

        // Rewind to Top Immediately
        document.getElementById('btn-rewind').addEventListener('click', (e) => {
            e.stopPropagation();
            window.scrollTo({ top: 0, behavior: 'instant' });
        });

        // Toggle button click listener
        btnToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlayPause();
        });

        // Speed adjustment listener
        speedSlider.addEventListener('input', (e) => {
            speed = parseInt(e.target.value, 10);
            speedVal.innerText = speed;
        });
        speedSlider.addEventListener('click', (e) => e.stopPropagation());

        // Font Size Adjustments
        document.getElementById('btn-font-inc').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentFontSize < 24) {
                currentFontSize += 1.5;
                updateFontSize();
            }
        });

        document.getElementById('btn-font-dec').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentFontSize > 12) {
                currentFontSize -= 1.5;
                updateFontSize();
            }
        });

        function updateFontSize() {
            const elements = document.querySelectorAll('.text-content div');
            elements.forEach(el => {
                el.style.fontSize = `${currentFontSize}px`;
            });
        }

        // START ON LOAD IMMEDIATELY WITH ITEM 1 AT TOP
        window.onload = function() {
            window.scrollTo(0, 0); // Ensure Item 1 is visible instantly at top
            animationFrameId = requestAnimationFrame(scrollLoop);
        };
    </script>
